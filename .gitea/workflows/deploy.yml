name: Build and Deploy to celld

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync & Prune Content Chunks (Incremental Delta Check)
        env:
          OLLAMA_HOST: ${{ vars.OLLAMA_HOST || 'http://127.0.0.1:11434' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMBEDDING_GEMMA_MODEL: embeddinggemma-2:latest
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'gemma4:31b' }}
          EMBEDDING_MRL_DIM: ${{ vars.EMBEDDING_MRL_DIM || '768' }}
        run: |
          pnpm run index:chunks
          pnpm run check:chunks

      - name: Build Astro SSR Bundle for celld
        env:
          CI: "true"
          OLLAMA_HOST: ${{ vars.OLLAMA_HOST || 'http://127.0.0.1:11434' }}
          EMBEDDING_GEMMA_MODEL: embeddinggemma-2:latest
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'gemma4:31b' }}
          EMBEDDING_MRL_DIM: ${{ vars.EMBEDDING_MRL_DIM || '768' }}
        run: pnpm run build

      - name: Deploy to TrueNAS celld Fleet
        uses: https://git.rodydavis.dev/rodydavis/shared-actions/celld-deploy@main
        with:
          ssh_key: ${{ secrets.TRUENAS_SSH_KEY }}
          s3_access_key: ${{ secrets.CELLD_S3_ACCESS_KEY }}
          s3_secret_key: ${{ secrets.CELLD_S3_SECRET_KEY }}
          domain: rodydavis.com
          env_file_content: |
            OLLAMA_HOST=${{ vars.OLLAMA_HOST }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            EMBEDDING_GEMMA_MODEL=embeddinggemma-2:latest
            OLLAMA_MODEL=${{ vars.OLLAMA_MODEL || 'gemma4:31b' }}
            EMBEDDING_MRL_DIM=${{ vars.EMBEDDING_MRL_DIM || '768' }}
